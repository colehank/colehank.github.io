name: Update Google Scholar Citations

# Refreshes the citation counts behind the publication badges. Complements
# update-publications.yml, which refreshes the list of papers itself.
#
# NOT SCHEDULED, on purpose. Google Scholar blocks datacenter IPs, so on a
# GitHub runner `scholarly` hangs on a CAPTCHA page until the timeout kills it
# (exit 124) — verified at both 90s and 300s. It used to run three times a week
# and fail every time. Dispatching it by hand runs on the same runners and will
# fail the same way; it is kept only for the day that changes, or for a runner
# with a proxy configured.
#
# The path that actually works is running it locally, where your own IP is not
# blocked:
#
#     python3 -m pip install --user --break-system-packages scholarly pyyaml
#     python3 bin/update_scholar_citations.py
#     git add _data/citations.yml && git commit -m "Update Google Scholar citations" && git push
#
# Without _data/citations.yml the Scholar count simply does not render. The
# Altmetric and Dimensions badges are client-side and are unaffected.

on:
  workflow_dispatch:

# Without this the repo default (read) applies and the `git push` below fails
# with a 403 whenever there is actually something to commit.
permissions:
  contents: write
  actions: write # needed to trigger the deploy workflow after a change

jobs:
  update-citations:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      # See docs/CUSTOMIZE.md for details on how to set up PAT for triggering subsequent workflows
      #        with:
      #          token: ${{ secrets.PAT }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          echo "🔧 Installing dependencies..."
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Save current citations.yml hash
        id: before
        run: |
          echo "📦 Checking existing citations.yml hash..."
          if [ -f _data/citations.yml ]; then
            sha_before=$(sha256sum _data/citations.yml | awk '{print $1}')
            echo "sha_before=$sha_before" >> $GITHUB_OUTPUT
            echo "📝 SHA before: $sha_before"
          else
            echo "sha_before=none" >> $GITHUB_OUTPUT
            echo "📝 No existing citations.yml file found."
          fi

      - name: Run citation update script
        id: run_citation_update
        shell: bash
        run: |
          set +e
          echo "🚀 Running citation update script (single attempt)..."
          start_time=$(date)
          # scholarly is configured for a 15s timeout with 3 retries across two
          # network calls, so 90s could be hit while still making progress.
          timeout 300 python bin/update_scholar_citations.py
          status=$?
          end_time=$(date)
          if [ $status -eq 0 ]; then
            echo "✅ Citation update succeeded (started at $start_time, ended at $end_time)."
            echo "✅ Citation update succeeded." >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Citation update script failed with exit code $status (started at $start_time, ended at $end_time)."
            echo "❌ Citation update script failed with exit code $status." >> $GITHUB_STEP_SUMMARY
          fi
          set -e

      - name: Save new citations.yml hash
        id: after
        run: |
          echo "🔍 Checking updated citations.yml hash..."
          if [ -f _data/citations.yml ]; then
            sha_after=$(sha256sum _data/citations.yml | awk '{print $1}')
            echo "sha_after=$sha_after" >> $GITHUB_OUTPUT
            echo "📝 SHA after: $sha_after"
          else
            echo "sha_after=none" >> $GITHUB_OUTPUT
            echo "📝 citations.yml was not created or is missing."
          fi

      - name: Report citations.yml change in summary
        run: |
          echo "📋 Comparing citation file hashes..."
          if [ "${{ steps.before.outputs.sha_before }}" != "${{ steps.after.outputs.sha_after }}" ]; then
            echo "✅ _data/citations.yml was updated."
            echo "✅ _data/citations.yml was updated." >> $GITHUB_STEP_SUMMARY
          else
            echo "ℹ️ _data/citations.yml was not changed."
            echo "ℹ️ _data/citations.yml was not changed." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Configure Git
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          echo "🔧 Git configured."

      - name: Commit and push if changed
        id: commit
        run: |
          # The fetch step is deliberately non-fatal (Google Scholar rate-limits
          # CI runners), so the file may legitimately not exist here. `git add`
          # on a missing path is a hard error, so check before staging.
          if [ ! -f _data/citations.yml ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "⚠️ _data/citations.yml was not produced — nothing to commit." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git add _data/citations.yml
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "ℹ️ _data/citations.yml unchanged." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "📤 Committing and pushing changes..."
            git commit -m "Update Google Scholar citations"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "✅ _data/citations.yml updated." >> "$GITHUB_STEP_SUMMARY"
          fi

      # Badge numbers are baked into the HTML at build time, so a change here
      # is invisible until the site is rebuilt.
      - name: Trigger site deploy
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml
